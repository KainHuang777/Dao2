<style>

:root{--paper:#eee5d3;--ink:#302f29;--jade:#496c64;--line:#b5a589;--red:#943f33;--gold:#a1864d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font:16px DaoSans,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;min-height:44px;min-width:44px;border:1px solid #b7aa92;background:#f3ecdf;cursor:pointer;padding:6px 14px;white-space:nowrap}button:hover{background:#ddd6c6}button:focus-visible{outline:3px solid var(--jade);outline-offset:-3px}button:disabled{color:#665f54;background:#d5cbb8;cursor:default}
button.active,button.primary{background:var(--jade);color:#fff8e9;box-shadow:inset 0 -2px var(--gold)}button.close{border:0;background:transparent;font-size:24px;padding:0;width:44px}h1,h2,h3,p{margin:0}h1{font-size:26px;font-weight:600}h2{font-size:22px;font-weight:600}h3{font-size:18px;font-weight:600}p{line-height:1.7}small{font-size:16px}b{font-weight:600}.muted{color:#685f50}.red{color:var(--red)}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding:12px;background:#79928f url('/assets/abode/sky_tearfall_v1.png') center/cover;position:relative;isolation:isolate}.paper{background:var(--paper);border:1px solid var(--line);box-shadow:0 3px 12px #182e2b24}.hud{display:flex;align-items:center;gap:16px;min-height:56px;padding:4px 12px}.hud .grow{flex:1}.progress{min-width:150px;flex:1;max-width:290px}.bar{height:5px;background:#c6bba5;margin-top:5px}.bar i{display:block;width:72%;height:100%;background:var(--jade)}.hud button{border:0}.life{white-space:nowrap;color:#7c5b21}.notice{display:flex;gap:4px}.dock{display:flex;align-self:flex-start;gap:4px;z-index:1}.dock button{font-size:18px;min-width:94px}.main{flex:1;min-height:0;display:flex;gap:12px}.workspace{min-width:0;flex:1;display:flex;flex-direction:column;padding:12px 18px 20px;border-top:4px solid #89774e;border-bottom:6px solid #89774e;gap:10px}.heading{display:flex;align-items:center;gap:6px;min-width:0}.heading .tabs{display:flex;flex:1;min-width:0;gap:4px}.heading h2{margin-right:8px}.context{display:flex;align-items:center;gap:12px;min-height:44px;border-bottom:1px solid var(--line);padding-bottom:4px}.context span{flex:1}.scroll{overflow:auto;min-height:0;flex:1;scrollbar-color:#9e9074 transparent;scrollbar-width:thin;padding:2px 4px 4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{display:flex;align-items:center;gap:16px;padding:14px;background:#f5eedf;border:1px solid #bfb195;min-width:0}.item img{width:104px;height:104px;object-fit:contain;flex:none}.item .copy{flex:1;min-width:0}.item p{margin:5px 0}.costs{display:flex;flex-direction:column;gap:4px}.costs span{display:flex;align-items:center;gap:6px}.costs img{width:24px;height:24px}.actions{display:flex;gap:6px;align-items:center}.modes{display:flex;gap:2px;margin-top:8px}.modes button{padding:3px 10px}.feedback{min-height:24px;color:var(--jade)}.feedback:empty{display:none}
.stock{width:228px;flex:none;padding:12px;display:flex;flex-direction:column;gap:10px}.stock .scroll{display:flex;flex-direction:column;gap:10px}.stockrow{display:flex;gap:10px;align-items:center;border-bottom:1px solid #c8bca6;padding-bottom:10px}.stockrow img{width:38px;height:38px;object-fit:contain}.stockrow p{line-height:1.45}.stockrow strong{font-size:18px;font-weight:600}.stockhead{display:flex;align-items:center;justify-content:space-between}.home .main{position:relative}.home-stack{width:268px;display:flex;flex-direction:column;gap:10px;min-height:0;z-index:1}.fullhud{padding:16px;display:flex;flex-direction:column;gap:10px}.home-stack .stock{width:100%;min-height:0;flex:1}.world{position:absolute;inset:0;pointer-events:none;display:block}.world img.island{position:absolute;inset:0;margin:auto;width:68%;height:95%;max-height:100%;object-fit:contain;filter:drop-shadow(0 18px 18px #344f4a66)}.world .hut{position:absolute;width:12%;left:40%;top:39%}.home-message{align-self:flex-start;position:absolute;left:50%;transform:translateX(-50%);top:10px;width:330px;padding:14px 20px;text-align:center;z-index:1}.home-tools{position:absolute;right:0;bottom:0;display:flex;gap:6px}.goal{padding:10px 14px;align-self:flex-start;background:var(--paper)}.save{display:flex;gap:10px;align-items:center;background:#f2ddc8;border:1px solid #b77854;padding:5px 12px;z-index:2}.save span{flex:1}.seal{font-family:DaoSerif,serif;color:var(--red);letter-spacing:.15em;font-weight:600}.biography{display:flex;gap:26px;min-height:0;flex:1}.life-summary{width:220px;flex:none;border-right:1px solid var(--line);padding-right:24px;text-align:center}.life-summary img{width:150px;height:150px;object-fit:contain}.life-summary p{margin-top:10px}.story{max-width:730px}.story h1{margin:12px 0}.story .prose{font-size:20px;line-height:1.95;max-width:34em}.story .closing{font:22px/1.7 DaoWen,serif;margin:16px 0}.fc .story h1{font-family:DaoSerif,serif;font-weight:800}.fc .story .seal{font-weight:900}.fc .story .prose{font-family:DaoWen,serif}.traces{display:flex;gap:8px;margin-top:12px}.trace{flex:1;border-top:1px solid var(--line);padding:10px 0}.trace img{width:64px;height:64px;object-fit:contain;float:left;margin-right:10px}.footer{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px}.footer span{flex:1}.fortune{display:flex;gap:24px}.fortune>img{width:240px;object-fit:contain;align-self:flex-start}.choices{display:flex;flex-direction:column;gap:10px;flex:1}.choice{background:#f5eedf;border:1px solid #c0b398;padding:12px;display:flex;gap:14px;align-items:center}.choice>div{flex:1}.choice p{margin-top:4px}.overlay{position:absolute;inset:0;background:#1c302e80;display:flex;align-items:center;justify-content:center;z-index:5;padding:16px}.modal{width:640px;max-width:100%;max-height:100%;display:flex;flex-direction:column;gap:10px;padding:16px 20px 20px}.modal .heading h2{flex:1;display:block}.modal .stockrow{padding:8px 0}.badge{padding:0 8px;color:#685d48;border-left:2px solid var(--gold)}.rotation{display:none}.short-only{display:none}
@media(max-width:1099px),(max-height:499px){.app{padding:6px;gap:4px}.hud{gap:10px;min-height:48px;padding:2px 8px}.hud .progress{max-width:175px;min-width:100px}.hud .optional{display:none}.main{gap:6px}.workspace{padding:0 10px 10px;gap:4px;border-top-width:2px;border-bottom-width:3px}.heading h2{display:none}.heading .tabs{gap:2px}.heading button{padding:4px 12px}.context{gap:8px;padding-bottom:0}.stock{display:none}.short-only{display:initial}.grid{grid-template-columns:1fr;gap:6px}.item{padding:8px 10px;gap:12px;min-height:114px}.item img{width:80px;height:80px}.item .costs img{width:24px;height:24px}.item p{margin:2px 0}.dock{gap:2px}.dock button{min-width:90px;padding:3px 12px}.feedback:empty{display:none}.home-stack{width:242px;gap:4px}.fullhud{padding:8px 12px;gap:4px}.fullhud .optional{display:none}.home-stack .stock{display:flex;padding:8px;gap:4px}.home-stack .stockrow{padding-bottom:4px}.home-stack .stockrow img{width:26px;height:26px}.home-stack .stock .stockhead,.home-stack .stock .scroll{display:none}.home-stack .stock{flex:none}.life-route .context{min-height:24px;border:0}.life-route .story h1{margin:0;display:inline;font-size:22px}.life-route .story .closing{display:inline;line-height:1.4;margin:0 0 0 16px}.life-route .story .prose{margin-top:6px}.home-message{width:270px;left:60%;padding:8px 12px;top:4px}.home .hud{display:none}.home .world img.island{width:72%;margin-left:20%}.goal{padding:4px 10px;min-height:44px;display:flex;align-items:center}.life-summary{display:none}.biography{gap:0}.story{max-width:100%}.story h1{font-size:23px;margin:4px 0}.story .prose{font-size:18px;line-height:1.8;max-width:100%}.story .closing{font-size:20px;margin:6px 0}.story .seal{display:none}.traces{margin-top:4px}.trace{padding:6px 0}.trace img{width:48px;height:48px}.footer{padding-top:4px}.fortune{gap:12px}.fortune>img{width:64px}.choice{padding:8px}.save{padding:2px 8px}.save span{line-height:1.3}.modal{padding:8px 12px 12px}.modal .heading h2{display:block}.modal .scroll{flex:initial}.modes{margin-top:3px}.costs{gap:0}}
@media(orientation:portrait){.rotation{display:flex;position:absolute;inset:0;z-index:20;background:var(--paper);align-items:center;justify-content:center;text-align:center;padding:30px}.rotation p{font-size:20px}}
</style>
<div class="app" id="app"></div>
<script>
const query=new URLSearchParams(location.search), initial=query.get('route')||'home';
const state={route:initial,font:query.get('font')||'b',resource:'quantity',messages:true,overlay:null,collapsed:false,failed:query.get('error')==='1',life:query.get('life')||'ended',long:query.get('long')==='1'};
const $=s=>document.querySelector(s), asset=p=>'/assets/'+p, image=(p,cls='')=>`<img class="${cls}" src="${asset(p)}" alt="">`;
const btn=(label,action,cls='',disabled=false)=>`<button type="button" data-action="${action}" class="${cls}" ${disabled?'disabled':''}>${label}</button>`;
const close=action=>`<button type="button" class="close" data-action="${action}" aria-label="關閉">×</button>`;
const routeNames={home:'洞府',buildings:'營造',manufacturing:'製造',skills:'技能',fortune:'機緣',life:'輪迴'};
const stocks=[['靈力','480 / 620','lingli'],['靈木','320 / 800','wood'],['玄石','180 / 600','stone_low'],['靈草','240 / 600','spirit_grass_low'],['銅精','18 / 100','bronze_essence']];
function stockRows(){return stocks.map(([n,v,img])=>`<div class="stockrow">${image('ui/resources-painted/'+img+'.png')}<div><b>${n}</b><p>${v}</p>${state.resource==='full'?'<p class="muted">產率依當前據點</p>':''}</div></div>`).join('')}
function stock(home=false){return `<aside class="stock paper"><div class="stockhead"><b>${home?'祖島庫存':'祖島 · 可用庫存'}</b>${home?'':btn('收起','collapse')}</div>${home?`<div class="actions">${['關閉','數量','完整'].map((n,i)=>btn(n,'res:'+['off','quantity','full'][i],state.resource===['off','quantity','full'][i]?'active':'')).join('')}</div>`:''}<div class="scroll">${state.resource==='off'&&home?'':stockRows()}</div></aside>`}
function hud(){return `<header class="hud paper"><b>金丹 · 一層</b><div class="progress"><span>修煉 72%</span><div class="bar"><i></i></div></div><span class="life">${state.route==='life'&&state.life==='ended'?'壽元 120 / 120 · 壽盡':'壽元 48 / 120'}</span>${btn('晉階','readiness','',true)}<div class="grow"></div><span class="optional muted">卯時 · 清風</span><div class="notice">${btn('緣','go:fortune')}${btn('訊息','messages')}${btn('設定','settings')}</div></header>`}
function heading(){let tabs=state.route==='buildings'||state.route==='manufacturing'?[['營造','buildings'],['空島','outposts'],['製造','manufacturing'],['運輸','transport']]:state.route==='skills'||state.route==='life'?[['技能','skills'],['輪迴','life'],['天賦','talents'],['成就','achievements']]:[['機緣','fortune'],['界域','realms']];return `<div class="heading"><h2>${routeNames[state.route]}</h2><div class="tabs">${tabs.filter(([,r])=>routeNames[r]).map(([n,r])=>btn(n,'go:'+r,r===state.route?'active':'',!routeNames[r])).join('')}</div>${close('home')}</div>`}
function context(text,resource=false){return `<div class="context"><span>${text}</span>${resource?btn('資源','inventory',state.collapsed?'':'short-only'):''}</div>`}
function materials(){return `<div class="costs"><span>${image('ui/resources-painted/wood.png')}靈木 320 / 120</span><span>${image('ui/resources-painted/stone_low.png')}玄石 180 / 80</span></div>`}
function building(){return context('祖島 · 建設材料',true)+`<div class="scroll"><div class="grid">${[['築基小院','courtyard'],['聚靈壇','foundation_reservoir'],['藏經閣','scripture_hall'],['靈草圃','herb_farm']].map(([n,a])=>`<article class="item">${image('ui/buildings-painted/'+a+'.png')}<div class="copy"><h3>${n} · 二階</h3>${materials()}</div>${btn('升級','sample')}</article>`).join('')}</div></div>`}
function manufacturing(){return context('祖島 · 原料與成品',true)+`<div class="scroll"><div class="grid">${[['銅精','bronze_essence'],['靈材','spirit_timber'],['丹液','liquid']].map(([n,a],i)=>`<article class="item">${image('ui/resources-painted/'+a+'.png')}<div class="copy"><h3>${n} ${i===0?'· 加工中':''}</h3><p>原料可用 180 / 10 · 成品 ${i===0?18:12}</p><div class="modes">${btn('單批','mode','active')}${btn('批數','mode')}${btn('持續','mode')}</div>${i===0?'<div class="bar"><i></i></div>':''}</div><div>${btn(i===0?'停止':'開始','sample')}<br>${btn('設定','recipe')}</div></article>`).join('')}</div></div>`}
function skills(){return context('技能點 8,100 · 來源：藏經閣')+`<div class="scroll"><div class="grid">${[['結丹法','golden_core_formation','當前未研習 · 費用 7,650'],['吐納法','basic_meditation','目前三重 · 費用 90'],['築基訣','foundation_building','目前一重 · 費用 900']].map(([n,a,c])=>`<article class="item">${image('ui/skills-painted/'+a+'.png')}<div class="copy"><h3>${n}</h3><p>${c}</p><p class="muted">效果與資格詳情</p></div>${btn('研習','sample')}</article>`).join('')}</div></div>`}
function fortune(){return context('待決機緣 · 靈草 240 · 暫收仍保留本次事件',true)+`<div class="scroll"><div class="fortune">${image('ui/fortune-painted/traveler.png')}<div class="choices"><h2>雲路遇客</h2><p>雲路之側，一位行客以藥囊相詢。是否取出靈草，與他交換一段山中見聞？</p><div class="choice"><div><h3>以靈草相贈</h3><p>持有 240 / 需求 20 靈草</p><p class="muted">可知代價在此；結果尚未發生。</p></div>${btn('選擇','sample')}</div><div class="choice"><div><h3>拱手別過</h3><p>無資源消耗</p></div>${btn('選擇','sample')}</div><p class="muted">此為原創設計情境，未接正式事件或收據。</p></div></div></div>`}
function life(){let title=state.long?'雲外初行，山海留痕':'雲外初行';let status=state.life==='ended'?'第 2 世 · 壽盡 · 終點金丹一層':state.life==='early'?'第 2 世 · 此世暫結預覽 · 當前金丹一層':'第 2 世 · 此世行跡 · 當前金丹一層';return context(status)+`<div class="biography"><aside class="life-summary">${image('ui/reincarnation-painted/life_lamp_spent.png')}<h3>${state.life==='ended'?'命燈已熄':'在世預覽'}</h3><p>${state.life==='ended'?'壽元 120 / 120':'壽元 48 / 120'}</p><p>記錄完整度：設計範例</p><p class="muted">未有紀錄不寫成未發生。</p></aside><div class="scroll"><article class="story"><span class="seal">一世卷末</span><h1>${title}</h1><p class="closing">${state.life==='ended'?'一世行止，於此收卷。':'行跡仍在續寫，尚未落下卷末。'}</p><p class="prose">初居山中，築屋修行。其後開拓青木、玄礦兩島，往來漸遠。及至結丹，初居之外，已有數條穿雲而行的路。${state.long?'自祖島出發，先有屋舍可居，再有舟路相通；所記止於親歷，不為未見之事添筆。後來者讀至此處，仍可循一屋、兩島與結丹之日，辨認這一世走過的路。':''}</p><h3>此世留痕</h3><div class="traces">${[['築屋','buildings-painted/courtyard'],['兩島開拓','buildings-painted/forest_farm'],['初成金丹','skills-painted/golden_core_formation']].map(([n,a])=>`<div class="trace">${image('ui/'+a+'.png')}<b>${n}</b><p>範例事實</p></div>`).join('')}</div><p class="muted">題名與小傳為虛構設計資料；非玩家歷史。帳目與抉擇簿尚未開放。</p></article></div></div><footer class="footer"><span>道心持有 30 · 本次預覽 +20</span>${btn('保留／重置','inherit')}${btn('轉世預覽','confirm','primary')}</footer>`}
function home(){return `<div class="main"><div class="home-stack"><section class="fullhud paper"><h2>金丹 · 一層</h2><p>修煉 72% · 尚未功滿</p><div class="bar"><i></i></div><p class="life">壽元 48 / 120</p><p class="optional">卯時 · 清風</p><div class="actions">${btn('晉階','sample','',true)}${btn('緣','go:fortune')}${btn('設定','settings')}</div></section>${stock(true)}</div><div class="world">${image('abode/terrain.png','island')}${image('abode/island1/courtyard.png','hut')}</div>${state.messages?'<section class="home-message paper"><b>洞府歷程</b><p>雲氣初開，修行仍在繼續。</p>'+btn('收起訊息','togglemsg')+'</section>':''}<div class="home-tools">${btn('訊息','messages')}${btn('資源','inventory')}</div></div><div class="goal">下一步 · 查看修行門檻 ${btn('說明','readiness')}</div>`}
function overlay(){if(!state.overlay)return '';let title='',content='';switch(state.overlay){case'inventory':title='祖島 · 完整庫存';content=stockRows();break;case'messages':title='訊息歷程';content='<p>雲氣初開，修行仍在繼續。</p><p>此層供主動閱讀，關閉後回到原頁。</p>'+btn(state.messages?'洞府訊息：開':'洞府訊息：關','togglemsg');break;case'settings':title='設定';content='<p>關閉後返回原頁。以下只切換設計狀態。</p>'+btn(state.failed?'移除保存異常範例':'顯示保存異常範例','error')+btn('查看訊息','messages');break;case'recipe':title='配方設定 · 範例';content='<p>批數草稿：3 · 保留量：20</p><p>此樣張未提交或變更加工模式。</p>';break;case'confirm':title='轉世確認 · 樣張';content='<p>正式版在此揭露實際保留與重置；必須確認後才送命令。</p><p>樣張沒有遊戲命令，按確認只關閉此層。</p>'+btn('取消','dismiss')+btn('確認（樣張）','dismiss','primary');break;case'inherit':title='保留與重置 · 位置樣張';content='<p>正式內容沿原規則 View；此處不另定傳承規則。</p>';break;default:title='詳情 · 樣張';content='<p>實際資格、成本與結果由正式 Session 提供。此稿只示範資訊位置。</p>'}return `<div class="overlay" role="dialog" aria-modal="true" aria-label="${title}"><section class="modal paper"><div class="heading"><h2>${title}</h2>${close('dismiss')}</div><div class="scroll">${content}</div></section></div>`}
function render(){let homePage=state.route==='home', inventory=['buildings','manufacturing'].includes(state.route);$('#app').className='app '+(homePage?'home ':'')+(state.font==='c'?'fc':'fb')+(state.route==='life'?' life-route':'');$('#app').innerHTML=(homePage?'':hud())+(homePage?home():`<main class="main">${inventory&&!state.collapsed?stock():''}<section class="workspace paper">${heading()}${({buildings:building,manufacturing,skills,fortune,life}[state.route]||skills)()}<div class="feedback" id="feedback"></div></section></main>`)+(state.failed?'<div class="save" role="status"><span>保存失敗 · 已結算，尚未保存</span>'+btn('重試保存','retry')+'</div>':'')+`<nav class="dock">${[['洞府','home'],['經營','buildings'],['修行','skills'],['遊歷','fortune']].map(([n,r])=>btn(n,'go:'+r,(r===state.route||r==='skills'&&state.route==='life'||r==='buildings'&&state.route==='manufacturing')?'active':'')).join('')}</nav>`+overlay()+'<div class="rotation"><p>請將視窗轉為橫式<br>原頁面將在恢復橫式後保留。</p></div>';if(state.overlay){let buttons=[...document.querySelectorAll('button')];for(let b of buttons)if(!b.closest('.overlay'))b.inert=true;$('.overlay button')?.focus()}}
document.addEventListener('click',e=>{let b=e.target.closest('button[data-action]');if(!b||b.disabled)return;let [a,v]=b.dataset.action.split(':');if(a==='go'){state.route=v;state.collapsed=false;state.overlay=null}else if(a==='home'){state.route='home';state.overlay=null;state.collapsed=false}else if(a==='res')state.resource=v;else if(a==='togglemsg')state.messages=!state.messages;else if(a==='collapse')state.collapsed=true;else if(a==='dismiss')state.overlay=null;else if(a==='error'){state.failed=!state.failed;state.overlay=null}else if(a==='retry'){state.failed=false}else if(a==='sample'){if($('#feedback'))$('#feedback').textContent='操作結果位置樣張 · 未執行遊戲命令';return}else if(a==='mode'){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));return}else state.overlay=a;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.overlay)state.overlay=null;else if(state.route!=='home'){state.route='home';state.collapsed=false}render()}if(e.key==='Tab'&&state.overlay){let items=[...$('.overlay').querySelectorAll('button:not(:disabled)')];if(!items.length)return;let first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.designState=state;render();
</script></html>
