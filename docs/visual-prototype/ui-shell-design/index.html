<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI-SHELL-DESIGN · 樣張比較</title><style>
*{box-sizing:border-box}body{margin:0;background:#202825;color:#eee9dc;font:16px system-ui,sans-serif}header{padding:16px 20px;background:#28352f}h1{font-size:22px;margin:0 0 8px}p{margin:6px 0;line-height:1.5}label{display:inline-flex;gap:8px;align-items:center;margin:6px 16px 6px 0}select,button{font:inherit;min-height:44px;background:#f0e8d8;color:#302f29;border:1px solid #b9aa90;padding:6px 12px}main{padding:16px;overflow:auto}iframe{border:0;display:block;background:#eee5d3;box-shadow:0 4px 24px #0005}#label{margin-bottom:10px;color:#e3d3ab}a{color:#d4e7d8}
</style><header><h1>修仙問道 · 共用殼設計比較</h1><p>候選樣張／虛構資料，非正式遊戲。可切頁、開資源、訊息及設定，觀察返回與保存提示的位置。</p><label>畫面<select id="route"><option value="home">洞府</option><option value="buildings">營造</option><option value="manufacturing">製造</option><option value="skills">技能</option><option value="fortune">機緣</option><option value="life" selected>一世卷末</option></select></label><label>尺寸<select id="size"><option>1280×720</option><option>844×390</option><option>800×360</option></select></label><label>敘事字體<select id="font"><option value="b">F-B 黑體小傳／文楷卷末</option><option value="c" selected>F-C 粗明體題名／文楷小傳</option></select></label><label>生命狀態<select id="life"><option value="ended">壽盡</option><option value="early">提前轉世預覽</option><option value="living">在世查看</option></select></label><label><input id="long" type="checkbox">長文壓力樣本</label><label><input id="error" type="checkbox">保存失敗範例</label><p>畫框按標示尺寸原大展示；外層比較工具可捲動。正式遊戲仍使用 Godot 響應式容器。切換上方選項會重置樣張暫存狀態。</p></header><main><div id="label"></div><iframe id="preview" title="共用殼候選樣張"></iframe></main><script>
const ids=['route','size','font','life','long','error'];function update(){let[w,h]=document.getElementById('size').value.split('×').map(Number),frame=document.getElementById('preview');frame.width=w;frame.height=h;let q=new URLSearchParams;for(let k of ['route','font','life'])q.set(k,document.getElementById(k).value);for(let k of ['long','error'])q.set(k,document.getElementById(k).checked?'1':'0');frame.src='screen.html?'+q;document.getElementById('label').textContent=`${w} × ${h} · 1:1 邏輯尺寸 · 候選，待使用者接受`}ids.forEach(k=>document.getElementById(k).addEventListener('change',update));update();
</script></html>
