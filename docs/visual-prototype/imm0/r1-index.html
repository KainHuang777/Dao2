<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMM-0 · 三頁對照樣張</title>
<style>
:root{color-scheme:light;--ink:#293e37;--muted:#68726b;--jade:#326b59;--paper:#f4f0e5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 "Microsoft JhengHei",system-ui,sans-serif}header,main{max-width:1500px;margin:auto;padding:24px 32px}header{border-bottom:1px solid #c7c8b9}header p{margin:4px 0;color:var(--muted)}.eyebrow{font-size:13px;letter-spacing:.2em}h1{margin:8px 0;font-size:30px;font-weight:600}button,select,a{font:inherit}button,select{min-height:44px;padding:8px 16px;color:var(--ink);background:transparent;border:1px solid #a9b3a5;border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:var(--jade);color:#fff;border-color:var(--jade)}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #b57b3b;outline-offset:3px}nav,.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}nav{margin-bottom:16px}.tools{padding-bottom:20px}.tools label{display:flex;align-items:center;gap:8px}.spacer{flex:1}#note{border-left:3px solid var(--jade);padding:2px 16px;margin:0 0 20px;max-width:1000px}#note p{margin:4px 0}#note small{color:var(--muted)}.frames{display:grid;grid-template-columns:1fr 1fr;gap:16px}.frames.single{grid-template-columns:1fr;max-width:1280px;margin:auto}figure{margin:0;min-width:0}figcaption{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:16px}figcaption a{font-size:14px;color:var(--jade)}img{display:block;width:100%;height:auto;background:#ded9ca;border:1px solid #aaa897}figure[hidden]{display:none}.badge{border:1px solid #b79a72;border-radius:2px;padding:2px 8px;font-size:13px;color:#775a34}.foot{margin-top:24px;color:var(--muted);font-size:14px}.foot strong{color:var(--ink)}@media(max-width:950px){header,main{padding:20px 16px}.frames{grid-template-columns:1fr}h1{font-size:25px}}
</style>
<header><p class="eyebrow">修仙問道 v2 ／ IMM-0 ／ 2026.10.27</p><h1>清雅仙家手卷 · 三頁對照樣張</h1><p>同資料、同尺寸的 Godot 原生渲染。候選布局供審閱，正式遊戲尚未套用。 <span class="badge">待美術確認</span></p></header>
<main>
<nav aria-label="代表頁"><button data-page="home" aria-pressed="true">一 · 洞府</button><button data-page="manufacturing" aria-pressed="false">二 · 製造</button><button data-page="fortune" aria-pressed="false">三 · 機緣</button></nav>
<div class="tools"><label>狀態 <select id="state" aria-label="樣張狀態"></select></label><label>尺寸 <select id="size" aria-label="Godot 渲染尺寸"><option value="1280x720">1280 × 720 · 寬式</option><option value="844x390">844 × 390 · 短橫式</option></select></label><span class="spacer"></span><button data-mode="compare" aria-pressed="true">並排</button><button data-mode="candidate" aria-pressed="false">候選放大</button><button data-mode="current" aria-pressed="false">現況放大</button></div>
<aside id="note"></aside>
<section class="frames" aria-label="畫面對照"><figure id="current"><figcaption><span>現況 · 正式元件</span><a target="_blank" rel="noopener">開啟原尺寸圖 ↗</a></figcaption><img alt="現況原生畫面"></figure><figure id="candidate"><figcaption><span>候選 · 本輪隔離試排</span><a target="_blank" rel="noopener">開啟原尺寸圖 ↗</a></figcaption><img alt="候選原生畫面"></figure></section>
<p class="foot"><strong>審閱重點：</strong>洞府主體是否突出、材料與動作是否好找、機緣文字與選項是否好讀。可切換缺料、待決、感應就緒及保存異常；短式另附捲至選項末段的畫面。</p>
<p class="foot">畫面使用隔離的合成展示資料；製造倒數已凍結、保存失敗為呈現狀態注入。這是靜態樣張瀏覽器，圖中按鈕不會操作遊戲。未測試新動態、滑鼠遊戲命中、保存故障或 FPS。既有美術與字型沿用，未新增生成素材。</p>
</main>
<script>
const cases={home:[['home-normal','正常']],manufacturing:[['manufacturing-normal','加工中 · 7 秒'],['manufacturing-shortage','缺料 · 玄銅不足']],fortune:[['fortune-pending','待決 · 情境／選項'],['fortune-ready','感應就緒'],['fortune-save-error','保存異常'],['fortune-pending-tail','待決 · 短式選項末段']]};
const notes={home:['讓世界成為主畫面','HUD 與資源籌碼轉淡紙深墨，目的地整為一列；修士、島體、地標與共用導航保留。'],manufacturing:['對象 → 材料 → 動作','寬式改單列流程，放大產物、減少巢狀紙框；來源、需求、模式、設定、真實進度保留。缺料補可讀數量。'],fortune:['先讀情境，再作抉擇','寬式左側情境、右側三項選擇；短式保留首個動作，其他選項由原內捲區抵達。就緒與保存重試仍在固定區。']};
let page='home',mode='compare';const state=document.querySelector('#state'),size=document.querySelector('#size');
function fill(){const old=state.value;state.replaceChildren(...cases[page].filter(x=>x[0]!=='fortune-pending-tail'||size.value==='844x390').map(([v,t])=>new Option(t,v)));if([...state.options].some(x=>x.value===old))state.value=old;render()}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===page));document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));document.querySelector('.frames').classList.toggle('single',mode!=='compare');for(const v of ['current','candidate']){const f=document.querySelector('#'+v),src=`images/${state.value}-${v}-${size.value}.png`;f.hidden=mode!=='compare'&&mode!==v;f.querySelector('img').src=src;f.querySelector('img').alt=`${state.selectedOptions[0].text} · ${v==='current'?'現況':'候選'} · ${size.value}`;f.querySelector('a').href=src}const [title,desc]=notes[page];document.querySelector('#note').replaceChildren();const p=document.createElement('p'),strong=document.createElement('strong');strong.textContent=title;p.append(strong);const q=document.createElement('p');q.textContent=desc;const s=document.createElement('small');s.textContent=`Godot 邏輯尺寸與輸出像素均為 ${size.value.replace('x',' × ')}；本頁會縮圖以便對照，可開啟原圖檢視。`;document.querySelector('#note').append(p,q,s)}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;fill()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});state.onchange=render;size.onchange=fill;fill();
</script></html>
