<nav class="toolbar" aria-label="構圖審閱"><button class="active" id="show-character">角色頁</button><button id="show-meeting">初遇構圖</button><small>MAID-ART R2 · 構圖候選／非正式遊戲</small></nav>
<main class="frame"><section class="page"><header><h1 id="page-title">仙侍 · 青蘅</h1><nav class="tabs" id="tabs" aria-label="人物內容"><button class="active">人物</button><button disabled>職掌 · 未開</button><button disabled>羈絆 · 未開</button></nav><button class="close" aria-label="關閉預覽" title="關閉預覽">×</button></header>
<section class="character" id="character"><button class="portrait" aria-label="查看完整立繪"><img src="qingheng-portrait-r2.png" alt="青蘅透明全身立繪：深藍髮、青白竹紋漢服、手持書筆"></button><article class="copy"><div class="subtitle">青藍書卷 · 洞府仙侍</div><h2>青蘅</h2><div class="quote">「書可慢慢讀，<br>眼前的風雨，先一起避過吧。」</div><p>溫柔而有主見，習慣先理清眼前的事。她珍惜書頁，也記得與人許下的小小約定。</p><div class="label">人物印象</div><div class="tags"><span>書卷</span><span>細心</span><span>溫柔有主見</span></div><p>一冊書，一枝筆。此後簷下燈明，便多了一個可以說話的人。</p></article></section>
<section class="meeting" id="meeting"><div class="scene"><img src="qingheng-first-meeting-r2.png" alt="雨夜入府初遇場景候選"></div><section class="dialogue"><div><div class="speaker">青蘅 · 雨過書未濕</div><p id="line">冒昧叨擾。這一路只顧護著書，倒忘了替自己避雨……可容我借一角簷下，理好這幾頁？</p></div><div class="choices"><button data-reply="那便叨擾了。等雨停，我再慢慢說給你聽。">先進來避雨吧。</button><button data-reply="一路所見，還有幾件我不願忘的小事。你若有興趣，我們可慢慢翻。">書裡記著甚麼？</button></div></section></section>
<div class="footer" id="note">構圖審閱：點立繪可看全身；職掌／羈絆僅示入口位置。</div></section></main><div class="rotate">請橫屏靜修<br>旋轉視窗以審閱構圖</div><dialog id="art"><button aria-label="關閉立繪">×</button><img src="qingheng-portrait-r2.png" alt="完整透明立繪"></dialog>
<script>
const byId=id=>document.getElementById(id);function show(meeting){byId('character').style.display=meeting?'none':'grid';byId('meeting').style.display=meeting?'flex':'none';byId('tabs').hidden=meeting;byId('page-title').textContent=meeting?'初遇 · 雨過書未濕':'仙侍 · 青蘅';byId('show-character').classList.toggle('active',!meeting);byId('show-meeting').classList.toggle('active',meeting);byId('note').textContent=meeting?'對話／回應為敘事候選；點選只預覽下一句。':'構圖審閱：點立繪可看全身；職掌／羈絆僅示入口位置。'}byId('show-character').onclick=()=>show(false);byId('show-meeting').onclick=()=>show(true);document.querySelector('.portrait').onclick=()=>byId('art').showModal();byId('art').querySelector('button').onclick=()=>byId('art').close();document.querySelector('.close').onclick=()=>{show(false);byId('note').textContent='預覽已返回人物；這是獨立審閱工具。'};document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>byId('line').textContent=b.dataset.reply);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!byId('art').open)show(false)});
